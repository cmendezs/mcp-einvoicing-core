name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies (incl. pdf/qr/xslt2 extras for tests)
        run: pip install -e ".[dev,audit,pdf,qr,xslt2]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest --tb=short

  # ── Type check ─────────────────────────────────────────────────────────────
  lint:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev dependencies (incl. pdf/qr/xslt2 extras)
        run: pip install -e ".[dev,audit,pdf,qr,xslt2]"

      - name: Type-check with mypy
        run: mypy src/mcp_einvoicing_core/
        continue-on-error: true  # Non-blocking until type stubs are complete
