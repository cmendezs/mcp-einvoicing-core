name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --no-sources

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Run tests
        run: uv run pytest --tb=short

  # ── Type check ─────────────────────────────────────────────────────────────
  lint:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --no-sources

      - name: Type-check with mypy
        run: uv run mypy src/mcp_einvoicing_core/
        continue-on-error: true  # Non-blocking: 193 pre-existing type errors, tracked separately

      # ruff format --check is intentionally not enabled here yet: most of
      # src/ has never been run through `ruff format`, and doing so right
      # now would touch files that overlap with in-progress, uncommitted
      # Peppol/EN16931 work. Format + enable this once that work lands.
