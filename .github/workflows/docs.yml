name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README*"
      - "docs/**"
      - "CHANGELOG.md"
      - "src/**/tools/**"
      - "src/**/server.py"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Theme drift check
        # Fails the build if this repo's docs-theme.css has diverged from the canonical copy
        # in the root monorepo — see context-library/decisions/docs-site.md ("no per-repo
        # recoloring") and docs-site-template.md ("Theme (do not fork)"). The expected hash is
        # embedded here (not fetched live) because cmendezs/mcp-einvoicing is a private repo.
        # Update the literal hash below, in every repo's docs.yml, whenever the canonical
        # docs-theme.css intentionally changes.
        run: |
          echo "e5eb0d3508e075db1260a2c7eefb9807bf0c10dac59830d1f5f9dd1587494779  docs/src/styles/docs-theme.css" | shasum -a 256 -c - \
            || { echo "::error::docs/src/styles/docs-theme.css has diverged from the canonical theme in cmendezs/mcp-einvoicing. Do not fork the theme per repo — update the canonical file instead."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Upgrade npm
        # The npm bundled with actions/setup-node's Node 22 image has a bug validating
        # optional peer dependencies during `npm ci` (starlight-llms-txt nests an older
        # @astrojs/mdx whose optional peer on @astrojs/markdown-satteri trips it up),
        # confirmed during the mcp-einvoicing-core/mcp-einvoicing-be pilot rollout. npm 11
        # (verified locally) does not have this bug.
        run: npm install -g npm@11

      - name: Set up Python
        # tomllib (used by scripts/gen_llms_txt.py) is stdlib only from 3.11+.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Regenerate llms.txt
        working-directory: docs
        run: python3 scripts/gen_llms_txt.py

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
