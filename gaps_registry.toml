# mcp-einvoicing-core — gap registry
#
# Tracks gaps where country packages carry local workarounds pending a core fix.
# Only cross-package gaps belong here; core-internal bugs are tracked in roadmap-2026.md.
#
# Format:
#   [gap."<gap-id>"]
#   description  = "Short description matching the [GAP id=...] marker in the country package"
#   resolved     = false | true
#   resolved_in  = ""     # set to the core version that closes this gap
#
# To find all active gap markers in country packages:
#   grep -r "\[GAP id=" . --include="*.py" -n

[gap."core.schematron.xslt2_backend"]
description = "SchematronValidator (lxml/libxslt) cannot compile Schematron-derived stylesheets that use XPath 2.0+ constructs (every...satisfies, string-join, cast as) — the FNFE-MPE Factur-X 1.08 / ZUGFeRD rule sets need this. mcp-einvoicing-de carried a local SaxonSchematronValidator + version-dispatch factory in mcp_einvoicing_de/validators/schematron.py predating this registry (no [GAP id=...] marker). Promoted into core as SaxonSchematronValidator, get_xslt_version, and load_schematron_validator. Tracked in context-library/audit-history.md as DE-XSLT2-1 / FR-XSLT2-1."
resolved = true
resolved_in = "1.14.0"

# Follow-up:
#   mcp-einvoicing-de v0.7.1: migrated — validators/schematron.py no longer carries its own
#   copy of SaxonSchematronValidator; SchematronValidator(stylesheet_key) now delegates to
#   core's load_schematron_validator(). Done.
#   mcp-facture-electronique-fr's validators.py already consumes core's SchematronValidator
#   directly; it can switch validate_facturx to load_schematron_validator() once its own
#   package is next touched, to get the XSLT2 backend without needing a version-dispatch
#   helper of its own.

[gap."core.xml_utils.discouraged_char_sanitization"]
description = "xml_escape() only neutralizes the 5 XML metacharacters; it does not filter W3C XML 1.0 Appendix C 'discouraged' code points (C1 controls + DEL U+007F-U+009F, noncharacters U+FDD0-U+FDEF and U+nFFFE/U+nFFFF). These are valid per the Char production and pass XSD validation, but KSeF API v2.4.0 (PRD-live 2026-07-16) rejects documents containing them. mcp-ksef-pl had no local workaround (field values were inserted verbatim via xml_escape() in generator.py) — this was a live-compliance gap, not a workaround needing removal. Resolved by adding sanitize_xml_text()/DiscouragedCharacterError to xml_utils.py. Tracked in context-library/audit-history.md as PL-DISC-1."
resolved = true
resolved_in = "1.27.0"

[gap."core.tax_id.in_gstin"]
description = "TaxIdentifier had no India GSTIN validator. Confirmed [NO-CORE-MATCH] via context-library/core-state.md + a grep of TaxIdentifier in models.py during mcp-einvoicing-in's Step 0.5 core-reuse check, ahead of the country package itself being scaffolded (no [GAP id=...] marker exists yet since no India package exists). Resolved by adding TaxIdentifier.validate_in_gstin() — format-only (length 15 + digits-first-two/alphanumeric shape), per FORM GST INV-01 schema v1.1. No check-digit algorithm or full state+PAN+entity+check-char structural breakdown is confirmed by any locally staged NIC/GSTN document, so this validator does not assert either. See context-library/countries/in.md."
resolved = true
resolved_in = "1.31.0"

[gap."core.tax_id.in_pan"]
description = "TaxIdentifier.validate_in_pan() was planned alongside validate_in_gstin() (mcp-einvoicing-in Step 0.5) but is NOT added in this pass: the only staged document (FORM GST INV-01 schema v1.1) mentions PAN just once, in passing, on Supplier_Legal_Name's explanatory note ('Legal Name, as appearing in PAN of the Supplier') — no length, character-class, or check-digit fact is confirmed by any locally supplied source, not even PAN's length. Per the hallucination guardrail in .claude/skills/modify-core/SKILL.md ('if the context file does not contain the needed value, mark it with [NEED:] and stop'), this is deferred rather than fabricated. Needs either a staged Income Tax Department PAN-format document, or an explicit user decision to scope PAN validation out of mcp-einvoicing-in Phase 1."
resolved = false
resolved_in = ""
